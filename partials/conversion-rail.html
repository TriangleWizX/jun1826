<script>
  document.addEventListener("DOMContentLoaded", function () {
    const scrollBar = document.getElementById("scrollProgress");
    if (scrollBar) {
      let progressFrame = 0;
      const updateProgress = function () {
        const winScroll = window.scrollY || document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = height > 0 ? winScroll / height : 0;
        scrollBar.style.transform = "scaleX(" + Math.min(1, Math.max(0, scrolled)) + ")";
        progressFrame = 0;
      };
      const requestProgress = function () {
        if (!progressFrame) progressFrame = window.requestAnimationFrame(updateProgress);
      };
      window.addEventListener("scroll", requestProgress, { passive: true });
      window.addEventListener("resize", requestProgress, { passive: true });
      requestProgress();
    }

    (function initStickyVisibility() {
      const heroCta = document.querySelector([
        '.home-hero .primary-cta',
        '.hero-card .btn-white-secondary',
        '.hero-card .btn-green-primary',
        '.ss-hero .primary-cta',
        '#hero-cta'
      ].join(', '));
      const footerCta = document.querySelector('footer, .ss-new-site-footer, .ss-site-footer, .ss-cta-footer-section');
      const stickyCta = document.querySelector('.ss-mobile-actionbar');

      if (!stickyCta) return;
      stickyCta.classList.add("is-observed");
      if (!("IntersectionObserver" in window)) {
        stickyCta.classList.add("is-visible");
        return;
      }

      let heroOut = !heroCta;
      let footerIn = false;
      const updateVisibility = function () {
        stickyCta.classList.toggle("is-visible", heroOut && !footerIn);
      };

      if (heroCta) {
        const heroObserver = new IntersectionObserver(function (entries) {
          heroOut = !entries[0].isIntersecting;
          updateVisibility();
        }, { threshold: 0.1 });
        heroObserver.observe(heroCta);
      }

      if (footerCta) {
        const footerObserver = new IntersectionObserver(function (entries) {
          footerIn = entries[0].isIntersecting;
          updateVisibility();
        }, { threshold: 0.05 });
        footerObserver.observe(footerCta);
      }

      updateVisibility();
    })();
  });
</script>
